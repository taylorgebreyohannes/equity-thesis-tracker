[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-thesis-tracker"
version = "0.1.0"
description = "Reproducible tracking of an equity short thesis (GE Vernova) with Python, SQL, pandas and NumPy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",
    "jupyter",
    "scipy",
    "statsmodels",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
